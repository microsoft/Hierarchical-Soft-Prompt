[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-soft-prompt"
version = "0.1.0"
description = "Schema-hierarchical soft prompts for structured information extraction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Soumyadeep Dey"},
  {name = "Srikanth Tenneti"},
  {name = "Bamdev Mishra"},
  {name = "Shobhit Niranjan"},
  {name = "Mayur Datar"},
]
dependencies = [
  "accelerate>=0.33,<2",
  "numpy>=1.26,<3",
  "peft>=0.18.1,<1",
  "torch>=2.1",
  "tqdm>=4.66,<5",
  "transformers>=4.46,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hsp-train = "hierarchical_soft_prompt.cli:train_main"
hsp-evaluate = "hierarchical_soft_prompt.cli:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
